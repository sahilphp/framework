name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl, json, mbstring, pdo, pdo_mysql

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Code style
        run: composer check-style

      - name: Dependency audit
        run: composer audit

  lowest:
    name: Lowest dependencies (PHP 8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: openssl, json, mbstring, pdo

      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - run: composer test
